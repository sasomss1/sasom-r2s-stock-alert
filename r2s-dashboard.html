<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R2S Stock Alert — SASOM</title>
  <style>
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #666666;
      --muted2: #444444;
      --accent: #c8ff00;
      --accent-dark: #9fcc00;
      --red: #ff3b3b;
      --orange: #ff8c00;
      --yellow: #ffd600;
      --green: #00e676;
      --blue: #448aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-img {
      height: 24px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .logo-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .date-tag {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .sync-tag {
      font-size: 11px;
      color: var(--muted);
    }
    .refresh-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover { background: var(--accent-dark); }
    .refresh-btn:disabled { opacity: 0.6; cursor: default; }
    .sync-icon {
      width: 13px; height: 13px;
      animation: none;
    }
    .syncing .sync-icon { animation: spin 0.7s linear infinite; }

    /* ── SUMMARY BAR ── */
    .summary-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: #444; }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .chip-num { font-weight: 700; font-size: 13px; }

    /* ── MAIN ── */
    main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* ── SECTION ── */
    .section {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .section-label .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-red    { background: var(--red); }
    .dot-orange { background: var(--orange); }
    .dot-yellow { background: var(--yellow); }
    .dot-green  { background: var(--green); }
    .dot-blue   { background: var(--blue); }

    .count-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface2);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th:last-child, td:last-child { text-align: right; }
    td {
      padding: 9px 14px;
      border-bottom: 1px solid #1e1e1e;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.025); }

    .rank {
      font-size: 11px;
      color: var(--muted2);
      font-weight: 700;
      width: 24px;
    }
    .sku {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .name { font-weight: 500; color: #ddd; font-size: 12px; }
    .sold { color: var(--muted); font-size: 11px; }

    .restock {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange);
      white-space: nowrap;
    }
    .restock.zero { color: var(--muted2); }

    .days { font-size: 12px; white-space: nowrap; }
    .days.d0  { color: var(--red); font-weight: 700; }
    .days.d5  { color: var(--orange); font-weight: 600; }
    .days.d10 { color: var(--yellow); }
    .days.ok  { color: var(--muted); }

    .incoming-qty { color: var(--blue); font-weight: 700; font-size: 12px; }

    /* ── EMPTY / LOADING ── */
    .state {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LEFT ACCENT ── */
    .section.s-red    .section-head { border-left: 3px solid var(--red); }
    .section.s-orange .section-head { border-left: 3px solid var(--orange); }
    .section.s-yellow .section-head { border-left: 3px solid var(--yellow); }
    .section.s-green  .section-head { border-left: 3px solid var(--green); }
    .section.s-blue   .section-head { border-left: 3px solid var(--blue); }

    /* ── SCROLLABLE TABLE ── */
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img class="logo-img" src="https://d2cva83hdk3bwc.cloudfront.net/SASOM_PRIMARY_BK.png" alt="SASOM" onerror="this.src='https://d2cva83hdk3bwc.cloudfront.net/SASOM_LOGO_BLACK.png'" />
    <div class="logo-title">R2S Stock Alert</div>
  </div>
  <div class="header-right">
    <div class="date-tag" id="dateBadge">—</div>
    <div class="sync-tag" id="syncTag"></div>
    <button class="refresh-btn" id="syncBtn" onclick="loadData()">
      <svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Sync
    </button>
  </div>
</header>

<div class="summary-bar" id="summaryBar">
  <div class="state"><span class="spinner"></span>Loading...</div>
</div>

<main id="main"></main>

<script>
const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtLzro-DJNlqXym2sqHRLnuVx2kOy_pj_YpGoSkSXILJ4QczTg9FK4a3zR-gW4pXYg7CPhlqkQ78zn/pub?gid=0&single=true&output=csv';

function parseCSV(txt) {
  const lines = txt.trim().split('\n');
  const hdr = splitLine(lines[0]);
  return lines.slice(1).map(l => {
    const v = splitLine(l);
    const o = {};
    hdr.forEach((h, i) => o[h.trim().replace(/"/g,'')] = (v[i]||'').trim().replace(/"/g,''));
    return o;
  }).filter(r => r['SKU']);
}

function splitLine(line) {
  const res = []; let cur = '', q = false;
  for (const c of line) {
    if (c === '"') q = !q;
    else if (c === ',' && !q) { res.push(cur); cur = ''; }
    else cur += c;
  }
  res.push(cur);
  return res;
}

const n = (r, k) => parseFloat(r[k]) || 0;

function categorize(rows) {
  const soldOut=[], low=[], watch=[], inStock=[], incoming=[];
  rows.forEach(r => {
    const v2   = n(r,'Total R2S Live V2');
    const days = n(r,'Live Days Remaining');
    const inc  = n(r,'Incoming WMS Quantity');
    const sold = n(r,'Sold Order L30D');
    if (sold === 0) return;
    if (inc > 0) incoming.push(r);
    if (v2 === 0 || days === 0) soldOut.push(r);
    else if (days < 5)  low.push(r);
    else if (days < 10) watch.push(r);
    else inStock.push(r);
  });
  const byS = a => [...a].sort((x,y) => n(y,'Sold Order L30D')-n(x,'Sold Order L30D')).slice(0,10);
  const byI = a => [...a].sort((x,y) => n(y,'Incoming WMS Quantity')-n(x,'Incoming WMS Quantity')).slice(0,10);
  return { soldOut:byS(soldOut), low:byS(low), watch:byS(watch), inStock:byS(inStock), incoming:byI(incoming) };
}

function restock(r) {
  return Math.max(0, Math.ceil(n(r,'Final Supply Target Unit') - n(r,'Total R2S Live V2') - n(r,'Incoming WMS Quantity')));
}

function daysClass(d) {
  if (d === 0) return 'd0';
  if (d < 5)  return 'd5';
  if (d < 10) return 'd10';
  return 'ok';
}

function tableStock(rows) {
  if (!rows.length) return '<div class="state">No items</div>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>SKU</th><th>Product Name</th><th>Sold 30D</th><th>Restock</th><th>Days Left</th></tr></thead>
    <tbody>${rows.map((r,i) => {
      const d = Math.floor(n(r,'Live Days Remaining'));
      const rs = restock(r);
      return `<tr>
        <td class="rank">${i+1}</td>
        <td><span class="sku">${r['SKU']}</span></td>
        <td class="name">${r['Product Name']}</td>
        <td class="sold">${n(r,'Sold Order L30D').toLocaleString()}</td>
        <td><span class="restock${rs===0?' zero':''}">⚠️ +${rs}</span></td>
        <td><span class="days ${daysClass(d)}">⏳ ${d}d</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function tableInStock(rows) {
  if (!rows.length) return '<div class="state">No items</div>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>SKU</th><th>Product Name</th><th>Sold 30D</th><th>Days Left</th></tr></thead>
    <tbody>${rows.map((r,i) => {
      const d = Math.floor(n(r,'Live Days Remaining'));
      return `<tr>
        <td class="rank">${i+1}</td>
        <td><span class="sku">${r['SKU']}</span></td>
        <td class="name">${r['Product Name']}</td>
        <td class="sold">${n(r,'Sold Order L30D').toLocaleString()}</td>
        <td><span class="days ok">⏳ ${d}d</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function tableIncoming(rows) {
  if (!rows.length) return '<div class="state">No items</div>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>SKU</th><th>Product Name</th><th>Sold 30D</th><th>Incoming Qty</th></tr></thead>
    <tbody>${rows.map((r,i) => `<tr>
        <td class="rank">${i+1}</td>
        <td><span class="sku">${r['SKU']}</span></td>
        <td class="name">${r['Product Name']}</td>
        <td class="sold">${n(r,'Sold Order L30D').toLocaleString()}</td>
        <td><span class="incoming-qty">📦 ${n(r,'Incoming WMS Quantity').toLocaleString()}</span></td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

async function loadData() {
  const btn = document.getElementById('syncBtn');
  if (btn) { btn.disabled = true; btn.classList.add('syncing'); }
  document.getElementById('summaryBar').innerHTML = '<div class="state"><span class="spinner"></span>Syncing...</div>';
  document.getElementById('main').innerHTML = '';
  try {
    const res = await fetch(CSV + '&_=' + Date.now());
    const txt = await res.text();
    const rows = parseCSV(txt);
    const { soldOut, low, watch, inStock, incoming } = categorize(rows);

    const now = new Date();
    document.getElementById('dateBadge').textContent = '🗓️ ' + fmtDate(now);
    document.getElementById('syncTag').textContent = 'Synced ' + now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

    document.getElementById('summaryBar').innerHTML = [
      ['🔴','Sold Out', soldOut.length,'red'],
      ['🟠','Low',      low.length,    'orange'],
      ['🟡','Watch',    watch.length,  'yellow'],
      ['🟢','In Stock', inStock.length,'green'],
      ['🔵','In Coming',incoming.length,'blue'],
    ].map(([e,l,c]) => `<div class="chip"><span>${e}</span> ${l} <span class="chip-num">${c}</span> SKU</div>`).join('');

    const sections = [
      { cls:'s-red',    dot:'dot-red',    emoji:'🔴', title:'SOLD OUT',      sub:'restock now',       data:soldOut,  type:'stock' },
      { cls:'s-orange', dot:'dot-orange', emoji:'🟠', title:'LOW',           sub:'under 5 days',      data:low,      type:'stock' },
      { cls:'s-yellow', dot:'dot-yellow', emoji:'🟡', title:'WATCH',         sub:'under 10 days',     data:watch,    type:'stock' },
      { cls:'s-green',  dot:'dot-green',  emoji:'🟢', title:'IN STOCK',      sub:'',                  data:inStock,  type:'instock' },
      { cls:'s-blue',   dot:'dot-blue',   emoji:'🔵', title:'IN COMING',     sub:'',                  data:incoming, type:'incoming' },
    ];

    document.getElementById('main').innerHTML = sections.map(s => `
      <div class="section ${s.cls}">
        <div class="section-head">
          <div class="section-label">
            <span class="dot ${s.dot}"></span>
            ${s.title}${s.sub ? ` <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">— ${s.sub}</span>` : ''}
          </div>
          <span class="count-badge">${s.data.length} items</span>
        </div>
        ${s.type==='stock' ? tableStock(s.data) : s.type==='instock' ? tableInStock(s.data) : tableIncoming(s.data)}
      </div>`).join('');

  } catch(e) {
    document.getElementById('summaryBar').innerHTML = '';
    document.getElementById('main').innerHTML = `<div class="state" style="color:var(--red)">❌ Failed to load: ${e.message}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('syncing'); }
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
